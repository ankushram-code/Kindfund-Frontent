<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - KindFund</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand kindfund-logo fw-bold"
           href="index.html">

            <span class="logo-mark">
                <i class="bi bi-heart-fill"></i>
            </span>

            KindFund

        </a>


        <a href="index.html"
           class="login-home-btn">

            <i class="bi bi-house-door"></i>
            Home

        </a>

    </div>

</nav>



<!-- ================= LOGIN ================= -->

<section class="login-section modern-login-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">


                <div class="login-card modern-login-card">


                    <!-- Branding -->

                    <div class="text-center login-heading">

                        <div class="login-icon-modern">

                            <i class="bi bi-person-check-fill"></i>

                        </div>


                        <span class="login-label">
                            WELCOME BACK
                        </span>


                        <h2>
                            Welcome Back
                        </h2>


                        <p>
                            Login to continue making a difference
                            with KindFund.
                        </p>

                    </div>



                    <!-- Login Form -->

                    <form id="loginForm">


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>


                            <div class="input-icon-wrapper">

                                <i class="bi bi-envelope"></i>

                                <input type="email"
                                       class="form-control"
                                       placeholder="Enter your email"
                                       required>

                            </div>

                        </div>



                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>


                            <div class="input-icon-wrapper">

                                <i class="bi bi-lock"></i>

                                <input type="password"
                                       class="form-control"
                                       placeholder="Enter your password"
                                       required>

                            </div>

                        </div>



                        <!-- Remember / Forgot -->

                        <div class="d-flex justify-content-between
                                    align-items-center mb-4">


                            <div class="form-check">

                                <input class="form-check-input"
                                       type="checkbox"
                                       id="remember">

                                <label class="form-check-label"
                                       for="remember">

                                    Remember me

                                </label>

                            </div>


                            <a href="#"
                               class="forgot-link">

                                Forgot Password?

                            </a>

                        </div>



                        <!-- Login Button -->

                        <button type="submit"
                                class="btn btn-primary w-100 login-submit-btn">

                            Login

                            <i class="bi bi-arrow-right"></i>

                        </button>


                    </form>



                    <!-- Register -->

                    <div class="login-register-link">

                        <p>

                            Don't have an account?

                            <a href="register.html">
                                Create Account
                            </a>

                        </p>

                    </div>


                </div>

            </div>

        </div>

    </div>

</section>



<!-- ================= FOOTER ================= -->

<footer class="modern-footer">

    <div class="container text-center">

        <p class="mb-0">
            © 2026 KindFund. All Rights Reserved.
        </p>

    </div>

</footer>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!-- Custom JS -->

<script src="js/script.js"></script>


</body>

</html>
