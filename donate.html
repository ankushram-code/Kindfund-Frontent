<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donate - KindFund</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">

                 <a class="navbar-brand kindfund-logo" href="index.html">
                         <img src="images/kindfund-logo.png"
                          alt="KindFund Logo"
                      class="kindfund-logo-img">
                      </a>

        <a href="campaigns.html" 
        class="btn btn-outline-primary"
        onclick="window.location.href='campaign.html'
        ;return false;">
            <i class="bi bi-arrow-left"></i> Campaigns
        </a>

    </div>
</nav>


<!-- DONATION SECTION -->
<section class="donation-section py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="donation-card">

                    <!-- HEADER -->
                    <div class="text-center mb-4">

                        <div class="donation-icon">
                            <i class="bi bi-heart-fill"></i>
                        </div>

                        <h2 class="fw-bold mt-3">
                            Make a Donation
                        </h2>

                        <p class="text-muted">
                            Your contribution can help create a better tomorrow.
                        </p>

                    </div>


                    <!-- CAMPAIGN -->
                    <div class="selected-campaign mb-4">

                        <div>
                            <small class="text-muted">
                                Supporting Campaign
                            </small>

                            <h5 class="fw-bold mb-0" id="selectedCampaignTitle">
                                
                           </h5>
                        </div>

                        
                    </div>


                    <!-- FORM -->
                    <form id="donationForm">

                        <!-- AMOUNT -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Donation Amount
                            </label>

                            <div class="amount-buttons">

                                <button type="button"
                                        class="amount-btn"
                                        data-amount="100">
                                    ₹100
                                </button>

                                <button type="button"
                                        class="amount-btn"
                                        data-amount="500">
                                    ₹500
                                </button>

                                <button type="button"
                                        class="amount-btn"
                                        data-amount="1000">
                                    ₹1,000
                                </button>

                                <button type="button"
                                        class="amount-btn"
                                        data-amount="2000">
                                    ₹2,000
                                </button>

                            </div>

                            <input type="number"
                                   id="donationAmount"
                                   class="form-control mt-3"
                                   placeholder="Enter custom amount"
                                   min="1"
                                   required>

                        </div>


                        <!-- DONOR NAME -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Your Name
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>

                                <input type="text"
                                       class="form-control"
                                       placeholder="Enter your name"
                                       required>

                            </div>

                        </div>


                        <!-- EMAIL -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email Address
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>

                                <input type="email"
                                       class="form-control"
                                       placeholder="Enter your email"
                                       required>

                            </div>

                        </div>


                        <!-- PAYMENT -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Payment Method
                            </label>

                            <select id="paymentMethod"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select payment method
                                </option>

                                <option value="upi">
                                    UPI
                                </option>

                                <option value="card">
                                    Debit / Credit Card
                                </option>

                                <option value="netbanking">
                                    Net Banking
                                </option>

                            </select>

                        </div>


                        <!-- SECURE INFO -->
                        <div class="secure-donation mb-4">

                            <i class="bi bi-shield-check"></i>

                            <div>
                                <strong>Secure Donation</strong>
                                <p class="mb-0">
                                    Your information is protected and used only
                                    for donation processing.
                                </p>
                            </div>

                        </div>


                        <!-- BUTTON -->
                        <button type="submit"
                                class="btn btn-primary w-100 donation-submit-btn">

                            <i class="bi bi-heart-fill"></i>
                            Donate Now

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- FOOTER -->
<footer class="footer-section">
    <div class="container text-center">
        <p class="mb-0">
            © 2026 KindFund. All Rights Reserved.
        </p>
    </div>
</footer>


<script src="js/script.js"></script>

</body>
</html>
