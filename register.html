<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - KindFund</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand kindfund-logo fw-bold"
           href="index.html">

            <span class="logo-mark">
                <i class="bi bi-heart-fill"></i>
            </span>

            KindFund

        </a>


        <a href="index.html"
           class="login-home-btn">

            <i class="bi bi-house-door"></i>
            Home

        </a>

    </div>

</nav>



<!-- ================= REGISTER ================= -->

<section class="register-section modern-register-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">


                <div class="register-card modern-register-card">


                    <!-- Heading -->

                    <div class="text-center register-heading">

                        <div class="register-icon-modern">

                            <i class="bi bi-person-plus-fill"></i>

                        </div>


                        <span class="register-label">
                            JOIN KINDFUND
                        </span>


                        <h2>
                            Create Your Account
                        </h2>


                        <p>
                            Join KindFund and become part of a
                            community that creates positive change.
                        </p>

                    </div>



                    <!-- Register Form -->

                    <form id="registerForm">


                        <!-- Full Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>


                            <div class="input-icon-wrapper">

                                <i class="bi bi-person"></i>

                                <input type="text"
                                       class="form-control"
                                       placeholder="Enter your full name"
                                       required>

                            </div>

                        </div>



                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>


                            <div class="input-icon-wrapper">

                                <i class="bi bi-envelope"></i>

                                <input type="email"
                                       class="form-control"
                                       placeholder="Enter your email"
                                       required>

                            </div>

                        </div>



                        <!-- Phone -->

                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>


                            <div class="input-icon-wrapper">

                                <i class="bi bi-telephone"></i>

                                <input type="tel"
                                       class="form-control"
                                       placeholder="Enter your phone number"
                                       minlength="10"
                                       maxlength="10"
                                       inputmode="numeric"
                                       required>

                            </div>

                        </div>



                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>


                            <div class="input-icon-wrapper">

                                <i class="bi bi-lock"></i>

                                <input type="password"
                                       class="form-control"
                                       placeholder="Create a password"
                                       required>

                            </div>

                        </div>



                        <!-- Confirm Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>


                            <div class="input-icon-wrapper">

                                <i class="bi bi-shield-check"></i>

                                <input type="password"
                                       class="form-control"
                                       placeholder="Confirm your password"
                                       required>

                            </div>

                        </div>



                        <!-- Terms -->

                        <div class="form-check mb-4">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="terms"
                                   required>


                            <label class="form-check-label"
                                   for="terms">

                                I agree to the
                                <a href="#" class="terms-link">
                                    Terms & Conditions
                                </a>

                            </label>

                        </div>



                        <!-- Create Account -->

                        <button type="submit"
                                class="btn btn-primary w-100 register-submit-btn">

                            Create Account

                            <i class="bi bi-arrow-right"></i>

                        </button>


                    </form>



                    <!-- Login -->

                    <div class="register-login-link">

                        <p>

                            Already have an account?

                            <a href="login.html">
                                Login
                            </a>

                        </p>

                    </div>


                </div>

            </div>

        </div>

    </div>

</section>



<!-- ================= FOOTER ================= -->

<footer class="modern-footer">

    <div class="container text-center">

        <p class="mb-0">
            © 2026 KindFund. All Rights Reserved.
        </p>

    </div>

</footer>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!-- Custom JS -->

<script src="js/script.js"></script>


</body>

</html>
